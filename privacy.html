<body>
  <header class="site-header"><nav class="nav wrap"><a class="brand" href="index.html"><img src="assets/crashx-icon.png" alt=""><span>CrashBeacon</span></a><div class="nav-links"><a href="index.html" data-en="Home" data-zh="首页"></a><a href="support.html" data-en="Support" data-zh="支持"></a><button class="language-button" data-lang-button type="button">中文</button></div></nav></header>
  <main class="page wrap">
    <header class="page-header"><div class="eyebrow" data-en="Effective August 26, 2026" data-zh="生效日期：2026 年 8 月 26 日"></div><h1 class="page-title" data-en="Privacy Policy" data-zh="隐私政策"></h1><p class="page-lead" data-en="CrashBeacon is designed to analyze sensitive diagnostic information privately on your Mac." data-zh="CrashBeacon 旨在你的 Mac 本地、私密地分析敏感诊断信息。"></p></header>
    <article class="prose">
      <h2 data-en="Summary" data-zh="摘要"></h2><p data-en="CrashBeacon does not collect, transmit, sell, or share personal data. The app has no account system, advertising, analytics, or tracking." data-zh="CrashBeacon 不收集、不传输、不出售，也不共享个人数据。应用没有账户系统、广告、分析统计或跟踪功能。"></p>
      <h2 data-en="Files you choose" data-zh="你选择的文件"></h2><p data-en="CrashBeacon reads diagnostic reports, dSYM bundles, and source folders only after you select them with the macOS file picker or drag them into the app. These files may contain application names, device information, memory addresses, stack traces, file paths, and source code." data-zh="只有在你通过 macOS 文件选择器选择或拖入后，CrashBeacon 才会读取诊断报告、dSYM 包和源码目录。这些文件可能包含应用名称、设备信息、内存地址、堆栈、文件路径和源码。"></p>
      <h2 data-en="How processing works" data-zh="处理方式"></h2><p data-en="All parsing, dSYM UUID matching, symbolication, DWARF line lookup, and source matching happen locally inside the App Sandbox. CrashBeacon does not upload file contents or analysis results to a server." data-zh="所有解析、dSYM UUID 匹配、符号化、DWARF 行号查询和源码匹配都在 App Sandbox 内本地完成。CrashBeacon 不会将文件内容或分析结果上传到服务器。"></p>
      <h2 data-en="Storage and retention" data-zh="存储与保留"></h2><p data-en="Imported reports, symbol data, and source-folder selections are held for the current app session. CrashBeacon does not create a cloud copy or maintain a remote database. Closing the app clears the in-memory workspace." data-zh="导入的报告、符号数据和源码目录选择仅在当前应用会话中使用。CrashBeacon 不创建云端副本，也不维护远程数据库；关闭应用会清除内存中的工作区。"></p>
      <h2 data-en="Permissions" data-zh="权限"></h2><p data-en="CrashBeacon requests read-only access to user-selected files and folders. It does not modify source code, crash reports, or dSYM bundles. You can revoke access by closing the app and not selecting those items again." data-zh="CrashBeacon 只请求对用户所选文件和目录的只读访问，不会修改源码、崩溃报告或 dSYM。你可以关闭应用并不再重新选择这些项目，以撤销访问。"></p>
      <h2 data-en="Third parties" data-zh="第三方"></h2><p data-en="CrashBeacon contains no advertising SDKs, analytics SDKs, or third-party data processors. This website uses no cookies, analytics, or external scripts." data-zh="CrashBeacon 不包含广告 SDK、分析 SDK 或第三方数据处理服务。本网站也不使用 Cookie、分析统计或外部脚本。"></p>
      <h2 data-en="Changes" data-zh="政策变更"></h2><p data-en="If CrashBeacon's data practices change, this policy will be updated before the change is released. The effective date at the top will also be revised." data-zh="如果 CrashBeacon 的数据处理方式发生变化，本政策会在相关版本发布前更新，顶部的生效日期也会同步修改。"></p>
      <h2 data-en="Contact" data-zh="联系我们"></h2><p><span data-en="For privacy questions, use the CrashBeacon support page: " data-zh="如有隐私问题，请通过 CrashBeacon 支持页面联系："></span><a href="support.html" data-en="CrashBeacon Support" data-zh="CrashBeacon 支持"></a></p>
    </article>
